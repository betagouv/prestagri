name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Install and build docs
        run: |
          cd docs
          npm ci
          npm run build
          cd ..

      - name: Create deployment in temp directory
        run: |
          mkdir -p /tmp/prestagri-deploy/docs
          cp -r frontend/dist/* /tmp/prestagri-deploy/
          cp -r docs/dist/* /tmp/prestagri-deploy/docs/

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Deploy to gh-pages branch
        run: |
          cd /tmp/prestagri-deploy
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/betagouv/prestagri.git
          git checkout -b gh-pages
          # Add .nojekyll file to prevent Jekyll from processing
          touch .nojekyll
          git add -A
          git commit -m "Deploy to GitHub Pages"
          git push origin gh-pages --force
