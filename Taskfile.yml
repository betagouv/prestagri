version: '3'

tasks:
  default:
    cmds:
      - task --list
  setup:
    desc: install all the required dependencies for prestagri
    cmds:
      - cd backend && uv install
      - cd doc && npm install
  serve:
    desc: serve
    dir: backend
    cmds:
      - uv run fastapi dev
  doc:
    desc: run the doc locally
    cmds:
      - cd doc && npm run start
  doc_read:
    desc: serve the doc locally with the search option
    cmds:
      - cd doc && npm run build > /dev/null && http-server dist -p 4444
  update_backend_catala:
    desc: build catala code and add the generated source to the python library
    cmds:
      - cd catala && clerk build
      - mv catala/_target/prestagri_catala/python/* catala_python_package/src/prestagri_catala
      - cd catala_python_package && uv build
      - find catala_python_package/src/prestagri_catala/*.py -type f -exec sed -i 's/catala_runtime/.catala_runtime/g' {} +
      - sed -i 's/import dates/from .dates import */g' catala_python_package/src/prestagri_catala/catala_runtime.py
      - sed -i 's/dates\.//g' catala_python_package/src/prestagri_catala/catala_runtime.py
      - cd backend && uv pip install -e ../catala_python_package/
