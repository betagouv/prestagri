[project]
include_dirs = [
    "src/aide_scolarite",
    "src/enfance_handicapee",
    "src/sejour",
    "src/commun",
    "src/commun/structures"
]
build_dir    = "_build"    # Définit où sortir les fichiers compilés générés.
target_dir   = "_target"   # Définit où sortir les fichiers finaux des cibles.

# Chaque section [[target]] décrit une cible de construction pour le projet

[[target]]
name     = "prestagri_catala"
modules  = [ "Quotient_familial", "Aide_scolarite", "Handicap_moins_20_ans", "Sejour_loisir_sans_hebergement"]
tests    = [ "tests/commun", "tests/aide_scolarite", "tests/enfance_handicapee", "tests/sejour" ]
backends = [ "python" ]
